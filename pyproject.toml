# pyproject.toml – minimal project metadata for the snarks package.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "snarks"
version = "0.1.0"
description = "A pedagogical zk-STARK implementation in Python."
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
